openapi: 3.1.0
info:
  title: Company CRM API
  version: 0.1.0
  description: Initial contract skeleton. Extend only alongside implementation and tests.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: API process is responding
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp, service]
                properties:
                  status: { type: string, const: ok }
                  timestamp: { type: string, format: date-time }
                  service: { type: string }
  /tasks:
    get:
      operationId: listTasks
      summary: List tasks visible to the authenticated actor
      security: [{ oidcBearer: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [BACKLOG, TODO, IN_PROGRESS, IN_REVIEW, BLOCKED, DONE, CANCELED] }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A scoped page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TaskSummary' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createTask
      summary: Create a task in the active organization
      security: [{ oidcBearer: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskInput' }
      responses:
        '201': { description: Task created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Placeholder. Configure issuer/audience validation and key rotation before use.
  schemas:
    TaskSummary:
      type: object
      required: [id, key, title, status, priority, assigneeId, dueAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: TASK-1042 }
        title: { type: string }
        status: { type: string, enum: [BACKLOG, TODO, IN_PROGRESS, IN_REVIEW, BLOCKED, DONE, CANCELED] }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        assigneeId: { type: [string, 'null'], format: uuid }
        dueAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTaskInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 240 }
        description: { type: [string, 'null'], maxLength: 20000 }
        projectId: { type: [string, 'null'], format: uuid }
        assigneeId: { type: [string, 'null'], format: uuid }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
        dueAt: { type: [string, 'null'], format: date-time }
    ApiError:
      type: object
      required: [statusCode, code, message, requestId]
      properties:
        statusCode: { type: integer }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Actor is authenticated but not permitted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Concurrency or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
