name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # GAP-008 / GATE-004: real PostgreSQL in CI so migrations are applied on
    # every push instead of remaining unverified locally (no Docker here).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_dev
          POSTGRES_PASSWORD: local_dev_only_change_me
          POSTGRES_DB: crm_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm_dev:local_dev_only_change_me@localhost:5432/crm_dev?schema=public

    steps:
      - uses: actions/checkout@v7

      # Install pnpm before setup-node when setup-node caching is configured for pnpm.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @crm/api db:generate

      - name: Apply Prisma Migrations
        run: pnpm --filter @crm/api db:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Security & License Audit
        run: pnpm security:audit

      # GATE-003 evidence: reports which repository tokens resolve to a durable
      # implementation vs InMemory. Non-blocking in P00/P01; switch to
      # `pnpm audit:persistence:strict` before the P14 release gate.
      - name: Persistence reality report
        run: pnpm audit:persistence

      - name: Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests
        run: pnpm test:e2e